syntax = "proto3";

package buf.validate.conformance;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";

// Internal: this extension exists solely to drive protovalidate's own
// conformance suite generation. It is not part of any general-release surface
// and the extension number is not registered for external use.
extend google.protobuf.MessageOptions {
  optional TestCases test_cases = 60000;
}

// TestCases declares conformance test vectors for the host message.
//
// Each entry in `good` is a complete instance of the host message that must
// produce zero violations. Each entry in `bad` is a complete instance paired
// with the violations it must produce.
//
// The host message itself carries the protovalidate rules; this annotation
// only carries the values to test against those rules.
message TestCases {
  repeated google.protobuf.Any good = 1;
  repeated BadCase bad = 2;
}

// BadCase pairs a message instance with the exhaustive set of violations it
// must produce. An implementation that emits more or fewer violations than
// listed here fails the case.
message BadCase {
  google.protobuf.Any value = 1;
  repeated ExpectedViolation violations = 2;
}

// ExpectedViolation is the declarative counterpart to buf.validate.Violation.
// It carries only the fields a test author needs to write by hand.
message ExpectedViolation {
  // Required. Matches Violation.rule_id.
  string rule_id = 1;
  // Optional. The unmarshaled field path of the violation, in the harness's
  // existing string syntax (e.g. "val", "stock[\"apples\"]"). Empty means the
  // violation is at the message level.
  optional string field_path = 2;
  // Optional. The expected violation message.
  // for non-exempt rules the harness will derive the message by
  // evaluating the rule's (predefined).cel annotation against the bad value,
  // and this field is left unset.
  optional string message = 3;
}