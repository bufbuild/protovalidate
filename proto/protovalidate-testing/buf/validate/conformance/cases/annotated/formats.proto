// String rules for well-known textual formats: email, hostname, address,
// ip/ipv4/ipv6 (and prefix-length variants), uri/uri_ref, uuid/tuuid/ulid,
// host_and_port, protobuf_fqn / protobuf_dot_fqn.
//
// Each rule is a bool flag on StringRules. Setting it to true activates two
// (predefined).cel rules — the format check (rule_id "string.<flag>") and an
// empty-string companion (rule_id "string.<flag>_empty"). Setting it to false
// (the StringNot* hosts here) leaves the field set but inactive, so even
// malformed values produce zero violations.

syntax = "proto3";

package buf.validate.conformance.cases.annotated;

import "buf/validate/conformance/test_cases.proto";
import "buf/validate/validate.proto";

// StringEmail validates RFC 5322 email format. Empty input fires the
// companion string.email_empty rule rather than string.email.
message StringEmail {
  string val = 1 [(buf.validate.field).string.email = true];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
          val: "foo@bar.com"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: ""
          }
        }
        violations: [
          {
            rule_id: "string.email_empty"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: "foobar"
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: "foo@x0123456789012345678901234567890123456789012345678901234567890123456789.com"
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: "foo@-bar.com"
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: "foo@."
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: " foo@example.com "
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: "foo@example.com "
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: " foo@example.com"
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmail] {
            val: "<foo@example.com>"
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      }
    ]
  };
}

// StringNotEmail sets email = false. The rule is set but inactive, so even
// malformed values must produce zero violations.
message StringNotEmail {
  string val = 1 [(buf.validate.field).string.email = false];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringNotEmail] {
          val: ""
        }
      },
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringNotEmail] {
          val: "foobar"
        }
      }
    ]
  };
}

