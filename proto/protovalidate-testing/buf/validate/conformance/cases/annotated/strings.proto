// StringPattern enforces a regex.
message StringPattern {
  string val = 1 [(buf.validate.field).string.pattern = "(?i)^[a-z0-9]+$"];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringPattern] {
          val: "Foo123"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringPattern] {
            val: "!#@$#$%"
          }
        }
        violations: [
          {
            rule_id: "string.pattern"
            field_path: "val"
          }
        ]
      }
    ]
  };
}

// StringPatternEscapes covers escape handling in pattern strings.
message StringPatternEscapes {
  string val = 1 [(buf.validate.field).string.pattern = "\\* \\\\ \\w"];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringPatternEscapes] {
          val: "* \\ x"
