// StringEmailMaxLen exercises rule interaction: a single bad value can trip
// both string.email and string.max_len, and the test case asserts both
// violations fire.
message StringEmailMaxLen {
  string val = 1 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).string.max_len = 32
  ];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmailMaxLen] {
          val: "alice@example.com"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmailMaxLen] {
            val: "not-an-email"
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmailMaxLen] {
            val: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          }
        }
        violations: [
          {
            rule_id: "string.email"
            field_path: "val"
          },
          {
            rule_id: "string.max_len"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringEmailMaxLen] {
            val: "flux@xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.com"
          }
        }
        violations: [
          {
            rule_id: "string.max_len"
            field_path: "val"
          }
        ]
      }
    ]
  };
}