// StringIn requires val to be one of an allowed set.
message StringIn {
  string val = 1 [(buf.validate.field).string = {
    in: [
      "bar",
      "baz"
    ]
  }];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringIn] {
          val: "baz"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringIn] {
            val: "foo"
          }
        }
        violations: [
          {
            rule_id: "string.in"
            field_path: "val"
          }
        ]
      }
    ]
  };
}

// StringNotIn forbids val from being any of a denied set.
message StringNotIn {
  string val = 1 [(buf.validate.field).string = {
    not_in: [
      "fizz",
      "buzz"
    ]
  }];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringNotIn] {
          val: "bar"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringNotIn] {
            val: "fizz"
          }
        }
        violations: [
          {
            rule_id: "string.not_in"
            field_path: "val"
          }
        ]
      }
    ]
  };
}

// StringLen pins val's char length. ASCII, multibyte, and simple emoji values
// all count as 3 chars; ZWJ-composite emoji do not, exercising the dynamic
// "must be 3 characters" message that the oracle derives from the CEL.
message StringLen {
  string val = 1 [(buf.validate.field).string.len = 3];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringLen] {
          val: "foo"
        }
      },
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringLen] {
          val: "ʙǻɹ"
        }
      },
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringLen] {
          val: "😅😄👾"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringLen] {
            val: "fizz"
          }
        }
        violations: [
          {
            rule_id: "string.len"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringLen] {
            val: "👩🏽‍💻🧑🏾‍💻👨🏼‍💻"
          }
        }
        violations: [
          {
            rule_id: "string.len"
            field_path: "val"
          }
        ]
      }
    ]
  };
}

