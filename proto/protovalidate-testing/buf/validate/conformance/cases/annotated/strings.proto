  string val = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 5
  }];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringMinMaxLen] {
          val: "quux"
        }
      },
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringMinMaxLen] {
          val: "foo"
        }
      },
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringMinMaxLen] {
          val: "proto"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringMinMaxLen] {
            val: "pb"
          }
        }
        violations: [
          {
            rule_id: "string.min_len"
            field_path: "val"
          }
        ]
      },
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringMinMaxLen] {
            val: "validate"
          }
        }
        violations: [
          {
            rule_id: "string.max_len"
            field_path: "val"
          }
        ]
      }
    ]
  };
}

