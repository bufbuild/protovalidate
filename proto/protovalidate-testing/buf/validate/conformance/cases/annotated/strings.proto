syntax = "proto3";

package buf.validate.conformance.cases.annotated;

import "buf/validate/conformance/test_cases.proto";
import "buf/validate/validate.proto";

// StringNone has no rules. Any value passes.
message StringNone {
  string val = 1;

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringNone] {
          val: "foobar"
        }
      }
    ]
  };
}

// StringConst pins val to an exact value.
message StringConst {
  string val = 1 [(buf.validate.field).string.const = "foo"];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringConst] {
          val: "foo"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringConst] {
            val: "bar"
          }
        }
      }
    ]
  };
}

// StringConstDeclared pins val to an exact value and specifies an exact rule
message StringConstDeclared {
  string val = 1 [(buf.validate.field).string.const = "foo"];

  option (buf.validate.conformance.test_cases) = {
    good: [
      {
        [type.googleapis.com/buf.validate.conformance.cases.annotated.StringConstDeclared] {
          val: "foo"
        }
      }
    ]
    bad: [
      {
        value: {
          [type.googleapis.com/buf.validate.conformance.cases.annotated.StringConstDeclared] {
            val: "bar"
          }
        }
        violations: [
          {
            rule_id: "string.const"
            field_path: "val"
          }
        ]
      }
    ]
  };
}

